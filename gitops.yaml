---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: gitops
  path: "."
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      foo: bar
    substituteFrom:
      - kind: Secret
        name: gitops-secret-vars
        optional: true

---
apiVersion: v1
kind: Secret
metadata:
  name: gitops-secret-vars
stringData:
  MY_SECRET: "*-this-is-a-secret"
